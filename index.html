<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Partageo</title>
  <meta name="description" content="Partage les dépenses entre amis, en famille ou en coloc. Simple, rapide, hors ligne.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E9ECE7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- iPhone : icône et affichage plein écran une fois installée -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Partageo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Le manifeste (installation) est ajouté par js/pwa.js, seulement en http(s) -->
  <link rel="preload" href="fonts/schibsted-grotesk.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- L'écran courant est dessiné ici par app.js -->
  <div id="app"></div>

  <!-- Fenêtre modale unique (formulaires) -->
  <dialog id="dialog" class="sheet"></dialog>

  <!-- Messages temporaires (lus par les lecteurs d'écran) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Partageo a besoin de JavaScript pour fonctionner.</p></noscript>

  <!-- Ordre important : chaque fichier utilise ceux chargés avant lui -->
  <script src="js/core.js"></script>
  <script src="js/money.js"></script>
  <script src="js/store.js"></script>
  <script src="js/split.js"></script>
  <script src="js/settle.js"></script>
  <script src="js/share.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/link.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/expense-form.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/group-share.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
